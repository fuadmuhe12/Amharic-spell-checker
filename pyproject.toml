[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amharic_spell"
version = "0.1.0"
description = "Context-aware Amharic spell checker with interpolated N-gram models"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Project Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21.0",
    "typer>=0.9.0",  # For CLI
    "rich>=13.0.0",  # For pretty terminal output
    "joblib>=1.3.0", # For model serialization
    "tqdm>=4.65.0",  # Progress bars
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "streamlit>=1.25.0", # For Web App (Phase 5)
]

[project.scripts]
amharic-spell = "amharic_spell.app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
